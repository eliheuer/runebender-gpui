# The gate every change passes: formatted, clippy-clean, documented,
# and built and tested on Linux and macOS. The Linux job installs the
# system libraries gpui's Wayland and X11 backends link against, so a
# build that cannot open a window there fails here first. Two tests
# compile feature code against Virtua Grotesk, checked out from its
# own repository beside this one, the layout tests.rs expects.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Warnings are errors here. The wasm job leaves RUSTFLAGS alone so
    # .cargo/config.toml can set the wasm target features.
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: runebender-gpui
      - name: Fixture fonts
        uses: actions/checkout@v4
        with:
          repository: eliheuer/virtua-grotesk
          path: virtua-grotesk
          sparse-checkout: sources
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libssl-dev \
            libzstd-dev libvulkan1 libgit2-dev
      # rust-toolchain.toml pins stable; this only adds the components.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runebender-gpui
      - name: fmt
        working-directory: runebender-gpui
        run: cargo fmt --check
      - name: clippy
        working-directory: runebender-gpui
        run: cargo clippy --all-targets
      - name: doc
        working-directory: runebender-gpui
        run: cargo doc --no-deps
      - name: test
        working-directory: runebender-gpui
        run: cargo test
      - name: build
        working-directory: runebender-gpui
        run: cargo build --release

  wasm:
    name: wasm32 (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: runebender-gpui
      # The browser build embeds the demo font from the virtua-grotesk
      # checkout at compile time (web_host.rs, include_dir!).
      - name: Demo font
        uses: actions/checkout@v4
        with:
          repository: eliheuer/virtua-grotesk
          path: virtua-grotesk
          sparse-checkout: sources
      # The browser build needs wasm atomics and shared memory, which the
      # prebuilt standard library lacks, so std is rebuilt on a nightly.
      # This checks that the wasm-only code still compiles; the bundle
      # itself is built by hand with trunk. See docs/development.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-01
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runebender-gpui
          key: wasm
      - name: check
        working-directory: runebender-gpui
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-08-01
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
        run: cargo check --target wasm32-unknown-unknown

  vet:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned: the store is written by whichever version formats it,
      # and an older cargo-vet rejects a newer one's formatting.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet@0.10.2
      # Audits and exemptions live in supply-chain/. A new dependency
      # fails here until it is vetted or exempted on purpose.
      - name: cargo vet
        run: cargo vet --locked

  advisories:
    name: security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # RustSec advisories against anything in the lock file. Unlike
      # the rest of CI this can go red without a change of ours, when
      # an advisory is published; that is the point of it.
      - name: cargo deny check advisories
        run: cargo deny --locked check advisories
