[package]
name = "runebender-gpui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A font editor built on GPUI, a sibling of runebender-xilem for comparing UI frameworks"
repository = "https://github.com/eliheuer/runebender-gpui"

[dependencies]
regex = "1"
chrono = "0.4"
# gpui-component requires gpui from the zed git repo (it tracks zed
# main, where the platform layer was split into gpui_platform).
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
# The slider primitives (track / indicator / thumb) live in the base
# crate; the styled facade above does not expose them, and we build
# our own flat slider out of them.
gpui-base = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
kurbo = "0.13.1"
# CPU path rasterizer, for the preview's blur: gpui blurs box shadows
# and nothing else, so a real blurred image has to be rendered here.
tiny-skia = "0.11"
# Same version gpui and img2bez already pull, so `image::Frame` is the
# type gpui's RenderImage wants.
image = { version = "0.25", default-features = false }
norad = "0.18"
notify = "8"
futures = "0.3"
linesweeper = "0.4"
web-time = "1"
include_dir = "0.7.4"

# Shared editing/model crate used by all Runebender editors. Pulled
# from git so a plain clone (or `cargo install --git`) builds without
# a sibling checkout. To develop the two together, point cargo at a
# local copy — see "Building" in the README.
[dependencies.runebender-core]
git = "https://github.com/eliheuer/runebender-core"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
js-sys = "0.3"
