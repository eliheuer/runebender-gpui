[package]
name = "runebender-gpui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A font editor built on GPUI, a sibling of runebender-xilem for comparing UI frameworks"
repository = "https://github.com/eliheuer/runebender-gpui"

[dependencies]
# gpui-component requires gpui from the zed git repo (it tracks zed
# main, where the platform layer was split into gpui_platform).
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
kurbo = "0.13.1"
norad = "0.18"
