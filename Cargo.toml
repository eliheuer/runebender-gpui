[package]
name = "runebender-gpui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "The main Runebender font editor, built on GPUI"
rust-version = "1.96"
repository = "https://github.com/eliheuer/runebender-gpui"
keywords = ["font", "editor", "typography", "ufo", "gpui"]
categories = ["graphics", "text-editors"]

# The browser build is the one that feels the difference: fewer, larger
# codegen units and cross-crate inlining cut both the wasm's size and
# the work it does per frame. Native builds get the same treatment
# rather than carrying a second profile.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "deny"

# LINEBENDER LINT SET - Cargo.toml - v8
# See https://linebender.org/wiki/canonical-lints/
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"

elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
# missing_docs is left out of the set here: this is a binary, so
# clippy::missing_docs_in_private_items below covers every item, and
# it does not fire on the structs gpui::actions! generates, which
# cannot carry a doc comment.
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
too_many_arguments = "allow"

allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"

cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"
# END LINEBENDER LINT SET

# Every item gets a doc comment, pub(crate) and private included.
# missing_docs cannot see them in a binary crate, so clippy holds
# the line instead; CI denies warnings.
missing_docs_in_private_items = "warn"

[dependencies]
regex = "1"
chrono = "0.4"
# gpui and gpui_platform come from the zed git repo; the platform
# layer was split out of gpui there. Both are pinned to a revision,
# which is what lets `cargo install --git` resolve the same graph
# without --locked. It only became possible once gpui-component was
# gone: it depended on gpui by bare URL, and a pin on our side built
# a second copy of every gpui type.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "3624a5bfda8a4610bf9926499517a776c7028321" }
# font-kit is what gives the macOS platform its real font list. It is
# off by default; gpui-component used to switch it on for us, and
# without it text shapes and "paints" but rasterizes to nothing, so
# the whole interface comes up wordless.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "3624a5bfda8a4610bf9926499517a776c7028321", features = ["font-kit", "runtime_shaders"] }

kurbo = "0.13.1"
# CPU path rasterizer, for the preview's blur: gpui blurs box shadows
# and nothing else, so a real blurred image has to be rendered here.
tiny-skia = "0.11"
# Same version gpui and img2bez already pull, so `image::Frame` is the
# type gpui's RenderImage wants.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
norad = "0.18"
notify = "8"
futures = "0.3"
linesweeper = "0.4"
web-time = "1"
unicode_names2 = "3.1.0"
plist = "1"
skrifa = "0.44"
# Linebender's text stack. PlainEditor is the editing model behind
# the input widgets: cursor and word motion, selection, IME compose,
# accessibility. 0.8 is the version xix pins, and it shares harfrust
# 0.5 with runebender-core rather than pulling a second copy.
parley = { version = "0.8", default-features = false, features = ["std", "system"] }

# The config file at ~/.config/runebender/config.toml.
toml = "0.8"

# Local models run through the `font-ml` binary as a separate process
# (see src/edit/local_ai.rs), so candle and its build stay out of the
# editor. Nothing here links it.

# Shared library for all Runebender editors. Pulled from git so a
# plain clone (or `cargo install --git`) builds without a sibling
# checkout. To develop the two together, point cargo at a local copy:
# see "Building" in the README. default-features = false leaves out
# its command line, which is the only thing that needs clap.
[dependencies.runebender-core]
git = "https://github.com/eliheuer/runebender-core"
rev = "1193db6"
default-features = false

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
js-sys = "0.3"
# The demo font, compiled into the browser build. Native builds open a
# font from disk instead, so they do not need it.
include_dir = "0.7.4"

[dev-dependencies]
# Writing a .glyphspackage fixture for the import test. The crate is
# already in the tree through runebender-core.
glyphslib = "0.2.7"

# gpui_platform has no default features, and the two above both resolve
# to gpui_macos. Without one of these a Linux build gets gpui_linux
# with no windowing backend compiled into it, so there is nothing to
# open a window with. Both are enabled because which one a session
# uses is the user's, not ours: Wayland where the compositor speaks it,
# X11 under Xorg or XWayland.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
rev = "3624a5bfda8a4610bf9926499517a776c7028321"
features = ["wayland", "x11"]
